<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Ops Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f5f7; }
    .navbar { background: #1f2933; }
    .metric { font-size: 1.6rem; font-weight: 600; }
    .snippet { font-size: .85rem; color: #52606d; border-left: 3px solid #9aa5b1; padding-left: .6rem; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    td.q { max-width: 340px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-3">
  <div class="container-xl">
    <span class="navbar-brand mb-0 h1">Knowledge Ops Console</span>
    <span class="navbar-text small" id="hdr">sin índice</span>
  </div>
</nav>

<main class="container-xl">
  <ul class="nav nav-tabs mb-3" id="tabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t-ingest" type="button">Ingesta</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-ask" type="button">Preguntar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-eval" type="button">Evaluación</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-history" type="button">Historial</button></li>
  </ul>

  <div class="tab-content">
    <section class="tab-pane fade show active" id="t-ingest">
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="card"><div class="card-body">
            <h2 class="h6">Ingestar directorio</h2>
            <div class="input-group mb-2">
              <input id="ingest-path" class="form-control mono" value="samples/docs">
              <button class="btn btn-dark" id="btn-ingest">Ingestar</button>
            </div>
            <div id="ingest-msg" class="small"></div>
          </div></div>
          <div class="card mt-3"><div class="card-body">
            <h2 class="h6">Estado</h2>
            <dl class="row small mb-0" id="status-dl"></dl>
          </div></div>
        </div>
        <div class="col-lg-7">
          <div class="card"><div class="card-body">
            <h2 class="h6">Documentos de la última ingesta</h2>
            <table class="table table-sm small">
              <thead><tr><th>Documento</th><th class="text-end">Palabras</th><th class="text-end">Chunks</th><th>SHA-256</th></tr></thead>
              <tbody id="docs-body"></tbody>
            </table>
            <h2 class="h6 mt-3">Corridas de ingesta</h2>
            <table class="table table-sm small">
              <thead><tr><th>#</th><th>Fecha</th><th>Origen</th><th class="text-end">Docs</th><th class="text-end">Chunks</th><th class="text-end">ms</th></tr></thead>
              <tbody id="runs-body"></tbody>
            </table>
          </div></div>
        </div>
      </div>
    </section>

    <section class="tab-pane fade" id="t-ask">
      <div class="card mb-3"><div class="card-body">
        <form id="ask-form" class="row g-2">
          <div class="col-md-9"><input id="q" class="form-control" placeholder="Escriba su pregunta sobre los documentos indexados" required minlength="2"></div>
          <div class="col-md-1"><input id="k" type="number" min="1" max="10" value="4" class="form-control" title="k"></div>
          <div class="col-md-2 d-grid"><button class="btn btn-dark">Preguntar</button></div>
        </form>
      </div></div>
      <div id="answer"></div>
    </section>

    <section class="tab-pane fade" id="t-eval">
      <div class="card mb-3"><div class="card-body">
        <div class="input-group">
          <input id="gold" class="form-control mono" value="samples/gold/questions.jsonl">
          <button class="btn btn-dark" id="btn-eval">Ejecutar evaluación</button>
        </div>
        <div id="eval-msg" class="small mt-2"></div>
      </div></div>
      <div id="eval-metrics" class="row g-2 mb-3"></div>
      <div class="card"><div class="card-body">
        <table class="table table-sm small align-middle">
          <thead><tr><th>ID</th><th>Pregunta</th><th>Resultado</th><th>Abstuvo</th><th>Confianza</th><th>Doc esperado</th><th>Citado</th></tr></thead>
          <tbody id="eval-body"></tbody>
        </table>
      </div></div>
    </section>

    <section class="tab-pane fade" id="t-history">
      <div class="card"><div class="card-body">
        <button class="btn btn-sm btn-outline-secondary mb-2" id="btn-history">Actualizar</button>
        <table class="table table-sm small align-middle">
          <thead><tr><th>#</th><th>Fecha</th><th>Pregunta</th><th>Estado</th><th>Confianza</th><th>Doc principal</th><th class="text-end">ms</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v) => (v * 100).toFixed(0) + "%";

async function api(url, body) {
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {};
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function badge(ok, yes, no) {
  return `<span class="badge text-bg-${ok ? "success" : "danger"}">${ok ? yes : no}</span>`;
}

async function loadStatus() {
  const st = await api("/api/status");
  $("hdr").textContent = st.index ? `${st.index.docs} docs · ${st.index.chunks} chunks` : "sin índice";
  const rows = [
    ["Índice", st.index ? `${st.index.terms} términos` : "no construido"],
    ["Construido", st.index ? st.index.built_at : "—"],
    ["Ingestas", st.counts.ingest_runs],
    ["Consultas", st.counts.queries],
    ["Evaluaciones", st.counts.eval_runs],
    ["Home", st.root],
  ];
  $("status-dl").innerHTML = rows.map(([a, b]) => `<dt class="col-4">${a}</dt><dd class="col-8 mono">${esc(b)}</dd>`).join("");
  const docs = (st.last_ingest && st.last_ingest.documents) || [];
  $("docs-body").innerHTML = docs.length
    ? docs.map((d) => `<tr><td>${esc(d.name)}</td><td class="text-end">${d.words}</td><td class="text-end">${d.chunks}</td><td class="mono">${esc(d.sha256.slice(0, 12))}</td></tr>`).join("")
    : `<tr><td colspan="4" class="text-muted">Sin ingestas</td></tr>`;
  const runs = await api("/api/ingest/history");
  $("runs-body").innerHTML = runs.map((r) => `<tr><td>${r.id}</td><td>${esc(r.ts)}</td><td class="mono">${esc(r.source)}</td><td class="text-end">${r.docs}</td><td class="text-end">${r.chunks}</td><td class="text-end">${r.duration_ms}</td></tr>`).join("");
}

$("btn-ingest").onclick = async () => {
  $("ingest-msg").textContent = "Procesando…";
  try {
    const r = await api("/api/ingest", {path: $("ingest-path").value});
    $("ingest-msg").innerHTML = `<span class="text-success">OK: ${r.docs} docs, ${r.chunks} chunks.</span>`;
    await loadStatus();
  } catch (e) { $("ingest-msg").innerHTML = `<span class="text-danger">${esc(e.message)}</span>`; }
};

$("ask-form").onsubmit = async (ev) => {
  ev.preventDefault();
  $("answer").innerHTML = `<div class="text-muted">Buscando…</div>`;
  try {
    const a = await api("/api/ask", {question: $("q").value, k: Number($("k").value) || 4});
    const cites = a.citations.map((c) => `<li class="mb-2"><strong>[${c.n}] ${esc(c.doc)}</strong> <span class="text-muted">${esc(c.section)} · score ${c.score}</span><div class="snippet">${esc(c.snippet)}</div></li>`).join("");
    const hits = a.hits.map((h) => `<tr><td class="mono">${esc(h.chunk_id)}</td><td>${h.score}</td><td>${h.coverage}</td><td>${esc(h.matched.join(", "))}</td></tr>`).join("");
    $("answer").innerHTML = `
      <div class="card mb-3"><div class="card-body">
        <div class="d-flex justify-content-between mb-2">
          <h2 class="h6 mb-0">${a.abstained ? badge(false, "", "Abstención") : badge(true, "Respondida", "")}</h2>
          <span>Confianza <strong>${a.confidence}</strong></span>
        </div>
        <p class="mb-2">${esc(a.answer)}</p>
        ${a.reason ? `<p class="small text-muted">Motivo: ${esc(a.reason)}</p>` : ""}
        ${cites ? `<h3 class="h6 mt-3">Citas</h3><ul class="list-unstyled mb-0">${cites}</ul>` : ""}
      </div></div>
      <div class="card"><div class="card-body">
        <h3 class="h6">Recuperación (top-k)</h3>
        <table class="table table-sm small mb-0"><thead><tr><th>Chunk</th><th>Score</th><th>Cobertura</th><th>Términos</th></tr></thead><tbody>${hits}</tbody></table>
      </div></div>`;
  } catch (e) { $("answer").innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
};

function renderEval(rep) {
  if (!rep) { $("eval-body").innerHTML = `<tr><td colspan="7" class="text-muted">Sin evaluaciones</td></tr>`; return; }
  const m = rep.metrics, k = m.k;
  const cards = [
    [`recall@${k}`, m["recall@" + k]], ["citation hit", m.citation_hit], ["keywords", m.keyword_score],
    ["abstención", m.abstention_correct], ["falsa respuesta", m.false_answer_rate], ["pass rate", m.pass_rate],
  ];
  $("eval-metrics").innerHTML = cards.map(([n, v]) => `<div class="col-6 col-md-2"><div class="card"><div class="card-body py-2"><div class="small text-muted">${n}</div><div class="metric">${pct(v)}</div></div></div></div>`).join("");
  $("eval-body").innerHTML = rep.cases.map((c) => `<tr><td>${esc(c.id)}</td><td class="q">${esc(c.question)}</td><td>${badge(c.passed, "OK", "FALLA")}</td><td>${c.abstained ? "sí" : "no"}</td><td>${c.confidence}</td><td>${esc(c.expected_doc || "—")}</td><td>${esc(c.cited_docs.join(", ") || "—")}</td></tr>`).join("");
}

async function loadEval() {
  const r = await api("/api/eval/latest");
  renderEval(r.latest);
}

$("btn-eval").onclick = async () => {
  $("eval-msg").textContent = "Evaluando…";
  try {
    const rep = await api("/api/eval", {gold: $("gold").value});
    $("eval-msg").innerHTML = `<span class="text-success">Listo. Reportes: ${esc(rep.outputs.md)}</span>`;
    renderEval(rep);
    await loadStatus();
  } catch (e) { $("eval-msg").innerHTML = `<span class="text-danger">${esc(e.message)}</span>`; }
};

async function loadHistory() {
  const rows = await api("/api/history");
  $("history-body").innerHTML = rows.length
    ? rows.map((r) => `<tr><td>${r.id}</td><td>${esc(r.ts)}</td><td class="q">${esc(r.question)}</td><td>${badge(!r.abstained, "Respondida", "Abstención")}</td><td>${r.confidence}</td><td>${esc(r.top_doc || "—")}</td><td class="text-end">${r.latency_ms}</td></tr>`).join("")
    : `<tr><td colspan="7" class="text-muted">Sin consultas</td></tr>`;
}
$("btn-history").onclick = loadHistory;
document.querySelectorAll('[data-bs-target="#t-history"]').forEach((b) => b.addEventListener("shown.bs.tab", loadHistory));
document.querySelectorAll('[data-bs-target="#t-eval"]').forEach((b) => b.addEventListener("shown.bs.tab", loadEval));

loadStatus().catch(() => {});
loadEval().catch(() => {});
loadHistory().catch(() => {});
</script>
</body>
</html>
