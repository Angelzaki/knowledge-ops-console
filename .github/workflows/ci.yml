name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Ejecutar evaluación del gold set"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  eval:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.run_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Ingesta y evaluación (gold principal y adversarial)
        run: |
          python -m knowledge_ops ingest samples/docs
          python -m knowledge_ops eval --all
      - name: llm-ci-gates sobre gold principal (PASS)
        run: |
          pip install "git+https://github.com/Angelzaki/llm-ci-gates.git"
          python -m llm_ci_gates --metrics results/eval.json --thresholds ci/thresholds_knops.yaml
      - name: llm-ci-gates sobre gold adversarial (PASS)
        run: python -m llm_ci_gates --metrics results/eval_adversarial.json --thresholds ci/thresholds_adversarial.yaml
      - name: Resumen en el job
        if: always()
        run: cat results/eval.md results/eval_adversarial.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: results/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knowledge-ops-console:ci .
